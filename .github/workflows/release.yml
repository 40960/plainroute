# SPDX-License-Identifier: AGPL-3.0-only
name: release

# What this does: builds the image for linux/amd64 and linux/arm64, pushes it to GHCR, writes an
# SPDX SBOM, signs the image with cosign in keyless mode against this run's identity, and publishes
# a GitHub Release that names the version, the commit, the immutable digest, whether the release is
# a pre-release, and the commands a reader runs to verify what they pulled.
#
# There is no signing key in this repository. Keyless signing binds the signature to the identity of
# the workflow run that made it, so a build made anywhere else gives a different signature, and that
# is what a reader is checking when they verify an image.
#
# A workflow file cannot check itself: a file that fails to parse produces a run with no jobs and no
# logs, so no step inside it can report the parse failure. That is why this file is read by hand,
# and why every claim below is checked by a step inside the job instead of assumed by it.
#
# What this job cannot check is said as a measurement: the image size, the container settings and
# the health check answering /healthz need a docker daemon on a machine, and the verification
# commands below are the ones that take those numbers. Nothing here contacts a provider.
#
# Tags that trigger this are v0.0.0 shaped, and the glob also matches a pre-release name such as
# v0.2.0-rc1, so a name that exists as a tag is published by a tag push. A manual run is the path
# for a name that is not pushed as a tag: it has no tag to read, so the name it publishes under is
# the input it was given, and that input has to be declared. Before this file declared it, the name
# could not be given at all, and the step that reads it could only fail.
#
# The identity keyless signing binds to is the ref the run started from: refs/tags/<name> for a run
# triggered by a tag, refs/heads/<branch> for a run a person started. That is not the same thing as
# the name the image is published under, so the identity is read from the run, and the release
# prints it.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          The name to publish under, for example v0.1.0-rc1. This file does not invent a name for a
          manual run: a run that guessed one could overwrite the image a reader pulls.
        required: true
        type: string

permissions:
  contents: write # the release
  packages: write # the image on ghcr.io
  id-token: write # cosign keyless signing against this run's identity

jobs:
  build:
    name: build, push, SBOM, sign
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.names.outputs.image }}
      tag: ${{ steps.names.outputs.tag }}
      ref: ${{ steps.names.outputs.ref }}
      prerelease: ${{ steps.names.outputs.prerelease }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: names
        id: names
        env:
          # The input arrives as data rather than as text inside the command, so a name is not a
          # shell string. What the step checks is what actually arrived, not what the form was asked
          # for.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # GHCR rejects an uppercase owner or image name, and the failure only appears at push
          # time, so the name is normalised here rather than carried from the repository name.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/plainroute"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # A manual run has no tag, so the name is the input it was given. What is checked here
            # is what actually arrived, not whether a required field was filled: a workflow cannot
            # read the form that started it, so the step answers for itself.
            tag=${INPUT_TAG:-}
            if [ -z "$tag" ]; then
              echo 'a manual run has no name: the input arrived empty, and this step does not invent one' >&2
              exit 1
            fi
          else
            tag=$GITHUB_REF_NAME
          fi
          # The shape is checked on the name whichever path supplied it, so the two ways of running
          # this file cannot disagree about what a release name is. It is stricter than the trigger
          # glob, so a tag that matches the glob but does not read as a version name is refused here
          # rather than published under.
          if ! grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' <<< "$tag"; then
            echo "the name this run is publishing under does not read as a release name: $tag" >&2
            exit 1
          fi
          # The name says whether this is a pre-release, so the flag cannot disagree with the name a
          # reader sees on the release.
          case "$tag" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          # The ref the run itself started from: refs/tags/<tag> when a tag triggered this,
          # refs/heads/<branch> when a person did. This is what the keyless certificate carries as
          # its identity, so it is not the same thing as the name being published under: on a manual
          # run the image carries a name the certificate does not name.
          echo "ref=$GITHUB_REF" >> "$GITHUB_OUTPUT"
          kind=$([ "$prerelease" = true ] && echo pre-release || echo ordinary)
          echo "published under $tag as a $kind release, made by a run on $GITHUB_REF, from event $GITHUB_EVENT_NAME"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: build and push for both platforms
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }}
          # The version the binary reports is the name this run publishes under, not a
          # constant in the source. A plain `go build` still reports dev.
          build-args: VERSION=${{ steps.names.outputs.tag }}
          # Provenance is written as an attestation by the builder, so it is bound to the image the
          # push produced rather than to a file a later step could have replaced. `image_id` was
          # removed here because this action has no input of that name: the run said so on the
          # runner.
          provenance: true

      - name: the pushed image carries both platforms
        id: digest
        run: |
          # A manifest list is the only thing that can say this: a build that quietly produced one
          # platform still reports success. Two runs have now shown what the answer looks like: the
          # first asked buildx for `.Digest` and `.Platform`, which its template does not have; the
          # second read `platform` as a string, while the builder prints an object with `os` and
          # `architecture`, plus two attestation entries named unknown/unknown. The check reads the
          # answer it was given and asks whether the platforms a reader can run are among the
          # entries.
          ref="${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }}"
          out=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}')
          echo "$out"
          printf '%s' "$out" > manifest.json
          python3 - <<'PY'
          import json, re
          d = json.load(open("manifest.json"))
          want = {"linux/amd64", "linux/arm64"}

          def named(entry):
              p = entry.get("platform")
              if isinstance(p, dict):
                  return "/".join(str(p.get(k, "")) for k in ("os", "architecture"))
              return p if isinstance(p, str) else ""

          # Attestation entries are named unknown/unknown by the builder. They are not platforms a
          # reader can run, so the check asks whether both wanted ones are present rather than
          # requiring the document to have no other entries.
          got = {named(m) for m in d.get("manifests", [])}
          missing = sorted(want - got)
          if missing:
              raise SystemExit("the pushed document does not name %s; it names %s"
                               % (", ".join(missing), ", ".join(sorted(got)) or "nothing"))
          digest = str(d.get("digest", ""))
          if not re.fullmatch(r"sha256:[a-f0-9]{64}", digest):
              raise SystemExit("the pushed document names no digest to publish by: %r" % digest)
          print("both platforms:", ", ".join(sorted(want)), "digest", digest)
          open("digest.txt", "w").write(digest)
          PY
          echo "digest=$(cat digest.txt)" >> "$GITHUB_OUTPUT"

      - name: SBOM
        uses: anchore/sbom-action@v0.17.0
        with:
          image: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: the SBOM is an SPDX document and not an empty file
        run: |
          # A file that exists is not a document. This parses it.
          if [ ! -s sbom.spdx.json ]; then
            echo 'the SBOM is empty' >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          d = json.load(open('sbom.spdx.json'))
          if not str(d.get('spdxVersion', '')).startswith('SPDX'):
              raise SystemExit('not an SPDX document: %r' % d.get('spdxVersion'))
          components = [c for c in d.get('packages', []) if c.get('name')]
          if not components:
              raise SystemExit('the SBOM names no components')
          print('SPDX %s, %d components' % (d['spdxVersion'], len(components)))
          PY

      - name: install cosign
        # The third run proved the runner image has no cosign: the step said so rather than
        # guessing. This action carries a bootstrap binary's digest in itself and uses that binary
        # to verify the release it installs, so the signer is not downloaded on trust. The action is
        # pinned to the commit the v4.1.3 tag named, and the cosign release is pinned to the version
        # whose output the two verifications below were read against.
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.5

      - name: sign and attest, keyless
        run: |
          # The install step put cosign on PATH. If it did not, this says so rather than signing
          # with a binary this job did not place there.
          if ! command -v cosign > /dev/null; then
            echo 'cosign is not on this runner' >&2
            exit 1
          fi
          image='${{ steps.names.outputs.image }}'
          tag='${{ steps.names.outputs.tag }}'
          # The signature and the attestation are attached to the tag, because a tag is what a
          # reader names. They are attached to the digest as well, so a reader who pulls by digest —
          # the only immutable name — can verify the same document.
          cosign sign --yes "$image:$tag"
          cosign sign --yes "$image@${{ steps.digest.outputs.digest }}"
          # cosign v2.6.5 refused the `--type sbom` alias on the runner: its help lists `spdx`, not
          # `sbom`. The URI is accepted by the version installed here and is what
          # `verify-attestation` asks for below, so the writer and the reader name the same
          # predicate type rather than two aliases.
          cosign attest --yes --type https://spdx.dev/Document --predicate sbom.spdx.json "$image:$tag"
          cosign attest --yes --type https://spdx.dev/Document --predicate sbom.spdx.json \
            "$image@${{ steps.digest.outputs.digest }}"

      - name: the signature verifies against this run
        run: |
          # The only step here that can show a signature is readable: a sign that wrote nothing
          # would report success. The identity is this workflow file plus the ref the run ran on, so
          # this is the same check a reader runs, with the repository named.
          #
          # The ref comes from the run, not from the name being published under, and on a manual run
          # those are two different things: the image carries the name a person gave it, while the
          # certificate names the branch the run started from. Checking the name here would be a
          # check that could only pass for a build triggered by a tag, and would say nothing about
          # this run. The issuer regexp names the GitHub OIDC service, not a repository path. A
          # public image signed by a GitHub Actions run verified with this exact issuer on cosign
          # v2.6.5, whose flag is `--certificate-oidc-issuer-regexp` rather than the shorter
          # spelling used before; the fifth run said the short flag does not exist. The attestation
          # step uses the same two checks.
          if ! command -v cosign > /dev/null; then
            echo 'cosign is not on this runner' >&2
            exit 1
          fi
          out=$(cosign verify \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${{ steps.names.outputs.ref }}" \
            --certificate-oidc-issuer-regexp 'https://token.actions.githubusercontent.com' \
            '${{ steps.names.outputs.image }}@${{ steps.digest.outputs.digest }}')
          echo "$out"
          printf '%s' "$out" > signature.json
          python3 - <<'PY'
          import json
          # This is what cosign v2.6.5 printed for the image this run signed: a list with a
          # `critical` object and an `optional` object carrying the certificate's Subject and
          # Issuer. A public image signed by a different cosign version printed a different `type`
          # string, so the fixture here is the answer this workflow's own signing step printed, not
          # another project's image.
          d = json.load(open('signature.json'))[0]
          critical = d['critical']
          optional = d.get('optional') or {}
          digest = critical['image']['docker-manifest-digest']
          want = '${{ steps.digest.outputs.digest }}'
          if digest != want:
              raise SystemExit('the signature names digest %s, not the digest checked: %s' % (digest, want))
          if critical['type'] != 'cosign container image signature':
              raise SystemExit('the signature is not a cosign image signature: %r' % critical['type'])
          # The verifier already requires this identity and issuer of the certificate; read them
          # back from what it printed, so a signature that verified for another run cannot be shown
          # as this run's own without saying so.
          subject = 'https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ steps.names.outputs.ref }}'
          if optional.get('Subject') != subject:
              raise SystemExit('the certificate names %r, not this run: %r' % (optional.get('Subject'), subject))
          if optional.get('Issuer') != 'https://token.actions.githubusercontent.com':
              raise SystemExit('the certificate issuer is %r' % optional.get('Issuer'))
          print(optional['Subject'], critical['type'], digest)
          PY

      - name: the attestation verifies against this run
        run: |
          # Writing a file is not the same as writing an attestation a reader can verify. This is
          # the command the release body prints, run here so the run answers it, and it is read from
          # the digest rather than from the name, because the digest is the immutable name.
          if ! command -v cosign > /dev/null; then
            echo 'cosign is not on this runner' >&2
            exit 1
          fi
          out=$(cosign verify-attestation --type https://spdx.dev/Document \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${{ steps.names.outputs.ref }}" \
            --certificate-oidc-issuer-regexp 'https://token.actions.githubusercontent.com' \
            '${{ steps.names.outputs.image }}@${{ steps.digest.outputs.digest }}')
          echo "$out"
          # The payload has to be the document the build job wrote, not a signature that verifies
          # over an empty predicate: the same two facts the SBOM step checked, read from what the
          # registry served. The document is written to a file first, because the script below is
          # read from stdin.
          printf '%s' "$out" > attestation.json
          python3 - <<'PY'
          import base64, json
          # cosign prints one JSON envelope per matching attestation, one per line. This run
          # attached the same SBOM to the tag and to the digest, so a reader verifying by digest
          # gets two envelopes of the same document; a single-object fixture hid that. The text is
          # read as a stream of JSON values, and every envelope it contains has to be the document
          # the build wrote.
          decoder = json.JSONDecoder()
          text = open('attestation.json').read()
          envelopes, pos = [], 0
          while pos < len(text):
              while pos < len(text) and text[pos].isspace():
                  pos += 1
              if pos >= len(text):
                  break
              d, pos = decoder.raw_decode(text, pos)
              envelopes.append(d)
          if not envelopes:
              raise SystemExit('cosign printed no attestation to verify')
          written = json.load(open('sbom.spdx.json'))
          written_components = [c for c in written.get('packages', []) if c.get('name')]
          for d in envelopes:
              if d.get('payloadType') != 'application/vnd.in-toto+json':
                  raise SystemExit('the attestation is not an in-toto statement: %r' % d.get('payloadType'))
              stmt = json.loads(base64.b64decode(d['payload']))
              if not str(stmt.get('_type', '')).startswith('https://in-toto.io/Statement/'):
                  raise SystemExit('the payload is not an in-toto statement: %r' % stmt.get('_type'))
              predicate = stmt.get('predicate') or {}
              components = [c for c in predicate.get('packages', []) if c.get('name')]
              if not str(predicate.get('spdxVersion', '')).startswith('SPDX'):
                  raise SystemExit('the attestation is not an SPDX document: %r' % predicate.get('spdxVersion'))
              if not components:
                  raise SystemExit('the attestation names no components')
              # The release attaches the file the build wrote; it must be the document the
              # attestation carries, not merely another SPDX document that happens to verify against
              # this run.
              if (predicate.get('spdxVersion') != written.get('spdxVersion')
                      or len(components) != len(written_components)):
                  raise SystemExit('the attestation and the attached SBOM are different documents')
          print(len(envelopes), 'attestations,', predicate['spdxVersion'], len(components), 'components')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sbom

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          # The flag comes from the name the run published under, so a run cannot mark a release the
          # other way round than the name says: a plain version is not a pre-release, a name with a
          # pre-release part is.
          prerelease: ${{ needs.build.outputs.prerelease }}
          files: sbom.spdx.json
          body: |
            ## What is published

            | | |
            | --- | --- |
            | Image | `${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}` |
            | Immutable digest | `${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}` |
            | Platforms | `linux/amd64`, `linux/arm64` |
            | Commit | `${{ github.sha }}` |
            | Pre-release | `${{ needs.build.outputs.prerelease }}` |
            | Signing identity | `https://github.com/40960/plainroute/.github/workflows/release.yml@${{ needs.build.outputs.ref }}` |
            | Licence | AGPL-3.0-only |

            Pull the digest, not the tag: a tag on GHCR can be moved by a later push, a digest cannot.

            ## Verify

            Run these from a machine with cosign. They are the commands that turn the claims above
            into numbers on your own machine.

            ```bash
            cosign verify \
              --certificate-identity-regexp 'https://github.com/40960/plainroute/.github/workflows/release.yml@${{ needs.build.outputs.ref }}' \
              --certificate-oidc-issuer-regexp 'https://token.actions.githubusercontent.com' \
              '${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}'

            cosign verify-attestation --type https://spdx.dev/Document \
              --certificate-identity-regexp 'https://github.com/40960/plainroute/.github/workflows/release.yml@${{ needs.build.outputs.ref }}' \
              --certificate-oidc-issuer-regexp 'https://token.actions.githubusercontent.com' \
              '${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}'
            ```

            The signing identity is a workflow run, not a key: a build made somewhere else gives a
            different signature, which is the point of checking it. The ref in that identity is the ref
            the run started from, which is the tag when a tag triggered the build and the branch when a
            person did, so these commands are right for the run that published this image and for no
            other one.

            ## Run

            See the README. The image takes a config file, and keys are values inside that file: nothing
            in the program reads a key from the environment, so a key cannot enter the image by a name a
            running process inherited. `PLAINROUTE_CONFIG` only says where the file is.
