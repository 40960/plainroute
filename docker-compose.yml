#
# Run as the gateway in front of the targets the config describes. The config file holds the keys,
# so it is a secret: 600 permissions, on the host, mounted read-only. Nothing is in this file and
# nothing is in the image.

services:
  plainroute:
    build: .
    image: plainroute
    container_name: plainroute
    restart: unless-stopped

    # Loopback only. The api key gate is off by default, so a mapping on 0.0.0.0 would let any
    # process on the network use the configured keys. With the gate on, one key is still not a
    # network boundary: keep the port on loopback and tunnel it for a remote client.
    ports:
      - "127.0.0.1:8080:8080"

    environment:
      PLAINROUTE_CONFIG: /etc/plainroute/config.yaml

    # A directory mount, not a single-file mount. A single-file bind mount pins the inode the
    # container started with: when an editor replaces the file, the container keeps reading the old
    # inode and the live reload sees nothing. A directory mount is looked up on each read, so the
    # process sees the file the operator actually wrote.
    #
    # This is a deployment fact about bind mounts, not something this repository can check: the
    # daemon on the machine that runs the gateway is the place to confirm it. On the host, the file
    # needs 600 permissions and the directory 700, so nothing else on the machine can read it.
    volumes:
      - ./plainroute-config:/etc/plainroute:ro

    # A base_url of 127.0.0.1 inside the container is the container itself, not the host.
    # When the upstream runs on the host, write host.docker.internal in the config file.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Nothing is written at runtime, so the container can be read-only. /tmp exists as
    # tmpfs for the health check and for Go's own scratch files.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # The image already runs as a named non-root user (uid 100). Nothing here changes it.
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
          pids: 64

    stop_grace_period: 30s

    # The health check lives in the image and is the live endpoint. Readiness is not checked
    # here on purpose: a target that is cooling down is still a healthy container, and
    # readiness is what a load balancer acts on.
