#
# PlainRoute example config. Keys come from the environment only. A config file with a
# key in it is a file people commit by accident; this one never has one.

server:
  listen: ":8080"
  read_header_timeout: 10s
  read_timeout: 30s
  # 0 means no limit. A streaming response must not be cut off by an ordinary request
  # timeout, so the write timeout stays off by default.
  write_timeout: 0s
  idle_timeout: 120s
  shutdown_grace: 30s
  max_request_bytes: 2097152    # 2 MiB
  max_response_bytes: 33554432  # 32 MiB
  max_header_bytes: 1048576

timeouts:
  connect: 10s
  response_header: 60s
  # The only limit that applies to a stream. 0 is not allowed here, because a stream that
  # never goes silent is never released.
  stream_idle: 5m
  # 0 means no overall limit, which is what a long reasoning stream needs.
  request: 0s

routing:
  # least_active (default) or round_robin. Ties keep the order they appear in this file,
  # so a selection is reproducible instead of random.
  strategy: least_active
  cooldown:
    status:
      429: 10s
      401: 60s
      403: 60s
      503: 15s
    # The clamp applies to the value the upstream sent, not to a configured duration.
    # 0 turns the clamp off, so a value from the upstream is used as written; absent
    # means this default. A negative value is an error.
    max: 15m
    timeout: 0s      # cools a target after a connection or idle failure; 0 disables

# Off by default. The client owns backoff. When enabled, a retry only happens before any
# byte of the upstream response has reached the client.
retry:
  enabled: false
  max_attempts: 1

# Off by default. Opt-in, bounded, and only possible before the first byte.
fallbacks:
  enabled: false
  max_hops: 1
  log_event: true

headers:
  # Hop-by-hop headers are always dropped, in both directions. mode "deny" (default)
  # forwards everything except deny; mode "allow" forwards only allow.
  mode: deny
  deny: [Cookie, X-Forwarded-For]
  forward_request_id: true

logging:
  format: json      # json or text
  level: info       # debug, info, warn, error

metrics:
  enabled: true
  path: /metrics

# Optional, and off when nothing is written here. One api key the caller presents, read from
# the environment. No key configured means no gate: the gateway checks nothing, and any
# process that can reach the listening port can use the targets. When a key is set it is
# compared in constant time, and the key that goes upstream is still the one configured for
# the selected target, so the caller key never reaches the provider.
#
# The gate covers the API endpoints (/v1/*). Health, readiness and the metrics page stay
# open, because a monitoring system that cannot authenticate is the ordinary case and those
# pages carry counts only.
#
# A variable named here but not present in the environment is a startup failure, not a
# silently open gate, because a half-configured gate reads as a working one.
#
# Give it a name this project owns. A generic name such as API_KEY can be exported by another
# program in the same shell, or set by a shared .env, and the gate then compares a value nobody
# chose for it: startup succeeds, and a key from a different program works as if it were the
# gate's own. The prefix is the only thing telling this project's secret from that one.
# auth:
#   api_key_env: PLAINROUTE_API_KEY

routes:
  # A route is a name a client can send. The model belongs to each target, so one route can
  # be served by several models, and two targets can differ by model, endpoint, key, headers
  # or concurrency limit alone. The model field is the only field PlainRoute changes in a
  # request body, and it changes by splicing bytes rather than re-serialising the document.
  demo:
    targets:
      - name: account-1
        model: provider/model-one
        base_url: https://api.example.com/v1
        api_key_env: EXAMPLE_API_KEY_1
        max_active: 4
      - name: account-2
        model: provider/model-one
        base_url: https://api.example.com/v1
        api_key_env: EXAMPLE_API_KEY_2
        max_active: 4

  local:
    targets:
      - name: ollama
        model: qwen3:8b
        base_url: http://127.0.0.1:11434/v1
        api_key_env: LOCAL_KEY
