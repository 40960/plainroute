# SPDX-License-Identifier: AGPL-3.0-only
#
# PlainRoute example config. Every key here is the placeholder replace-me, so this file is safe to
# commit. A config you actually run on is a different file, and it is a secret: the keys are values
# in it, so it needs 600 permissions, it is gitignored, and nothing this project writes prints what
# it reads from it. Copy this file, fill in the keys, and it is the file the gateway runs on.

server:
  # These are the fields a running process cannot change, because the listener and the
  # server object were built from the file as it was at startup: listen, the three server
  # timeouts, idle_timeout, shutdown_grace and max_header_bytes need a restart. A reload
  # that changes one of them is refused as a whole, including the request-level fields
  # written in the same file, and the refusal names the fields and not the values. The two
  # size limits below are read on every request, so those do change while the process
  # runs. The table in README.md lists which is which.
  listen: ":8080"
  read_header_timeout: 10s
  read_timeout: 30s
  # 0 means no limit. A streaming response must not be cut off by an ordinary request
  # timeout, so the write timeout stays off by default.
  write_timeout: 0s
  idle_timeout: 120s
  shutdown_grace: 30s
  # 0 or absent here means the library default: 8 MiB for a request body and 32 MiB for a
  # response. The numbers written below are what this project recommends for a coding-agent
  # workload, not the default a caller gets from nothing: a long context with a screenshot in it
  # is a body in the tens of megabytes, and a 2 MiB limit turned that into a 413. The limits stay
  # limits: a body over the number is a 413 before anything is forwarded, so the gateway never
  # sends a request it could not have answered.
  max_request_bytes: 33554432    # 32 MiB
  max_response_bytes: 67108864   # 64 MiB
  max_header_bytes: 1048576

timeouts:
  connect: 10s
  response_header: 60s
  # The only limit that applies to a stream. 0 is not allowed here, because a stream that
  # never goes silent is never released.
  stream_idle: 5m
  # 0 means no overall limit, which is what a long reasoning stream needs.
  request: 0s

config_reload:
  # The file you are reading is watched: a change to it is applied without a restart
  # and without a signal, normally within one interval. 0 or absent here means one
  # second. A value under 100ms is a startup error rather than a silent clamp, because
  # a watcher that looked every millisecond is the busy loop this floor exists to
  # prevent. SIGHUP is still the way to ask for a look now, when a change has to land at a
  # particular moment, and a signal on a file that has not changed is not a reload. The
  # content is hashed inside the watcher so one content is acted on once. No part of that
  # hash is printed: the file you are reading is the secret. A reload line carries the
  # path and the runtime generation, a count of the contents the process acted on. Which
  # fields a change can apply, and
  # which are refused because the process was built with them, is the table in README.md.
  interval: 1s

routing:
  # least_active (default) or round_robin. Ties keep the order they appear in this file,
  # so a selection is reproducible instead of random.
  strategy: least_active
  cooldown:
    # A window names a target, so a code belongs in the map only when it says something
    # about that target. A 401 or a 403 says this target's credential is the problem, and
    # holding the target out for a while is the whole state there is: PlainRoute has no
    # "this key is disabled" state, so a held-out key is asked again when the window ends.
    #
    # 503 is not in the core default map, and it is not written here. A 503 normally says
    # the service behind the key is temporarily unavailable, which is not a property of the
    # key, so a window on 503 holds a working key out for a failure that may not belong to
    # it. PlainRoute does not count consecutive failures, so it cannot tell a transient 503
    # from a broken target and should not pretend to. Write a window for 503 only when you
    # know your provider means the key, and 0 means no window, which is the same as leaving
    # the entry out.
    status:
      429: 10s
      401: 60s
      403: 60s
    # The clamp applies to the value the upstream sent, not to a configured duration.
    # 0 turns the clamp off, so a value from the upstream is used as written; absent
    # means this default, which is the core default of 15m. A negative value is an error.
    max: 15m
    timeout: 0s      # cools a target after a connection or idle failure; 0 disables

# Off by default. Opt-in, bounded, and only possible before the first byte. Both fields here are
# read by the request path. There is no retry block in this file, and writing one is a startup
# error: the client owns backoff, and a retry setting would be a field a loader can read that no
# code can use.
fallbacks:
  enabled: false
  max_hops: 1

headers:
  # Hop-by-hop headers are always dropped, in both directions. mode "deny" (default)
  # forwards everything except deny; mode "allow" forwards only allow.
  mode: deny
  deny: [Cookie, X-Forwarded-For]
  forward_request_id: true

logging:
  # Built once, at startup, so these two cannot change while the process runs: a change here needs
  # a restart, and a reload that changes them is refused as a whole. There is no runtime logger
  # swap, because a logger that can be replaced from a config file is the framework this project
  # stays out of.
  format: json      # json or text
  level: info       # debug, info, warn or error

metrics:
  enabled: true
  path: /metrics

# Optional, and off when nothing is written here. One api key the caller presents. No key configured
# means no gate: the gateway checks nothing, and any process that can reach the listening port can
# use the targets. When a key is set it is compared in constant time, and the key that goes upstream
# is still the one configured for the selected target, so the caller key never reaches the provider.
#
# The gate covers the API endpoints (/v1/*). Health, readiness and the metrics page stay
# open, because a monitoring system that cannot authenticate is the ordinary case and those
# pages carry counts only.
#
# There is no half state: the value written here is the value in force, so a gate that reads as on
# in the file is on. The old form named an environment variable, and a gate named by a variable could
# be on with a value this project did not choose, because a generic name such as API_KEY can be
# exported by another program in the same shell. Writing the value is the whole fix, and the field is
# refused now instead of ignored.
# auth:
#   api_key: replace-me

routes:
  # A route is a name a client can send. The model belongs to each target, so one route can
  # be served by several models, and two targets can differ by model, endpoint, key, headers
  # or concurrency limit alone. The model field is the only field PlainRoute changes in a
  # request body, and it changes by splicing bytes rather than re-serialising the document.
  demo:
    targets:
      - name: account-1
        model: provider/model-one
        base_url: https://api.example.com/v1
        api_key: replace-me
        max_active: 4
      - name: account-2
        model: provider/model-one
        base_url: https://api.example.com/v1
        api_key: replace-me
        max_active: 4

  local:
    targets:
      - name: ollama
        model: qwen3:8b
        base_url: http://127.0.0.1:11434/v1
        api_key: replace-me
